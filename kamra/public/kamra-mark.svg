<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="StayDesk mark">
  <!-- StayDesk: an arched doorway over the front desk, with the Meskel sun rising inside.
       Palette: #0D5C63 primary (highland teal), #F2B233 accent (Meskel gold). -->
  <circle cx="256" cy="258" r="46" fill="#F2B233" />
  <g fill="none" stroke="#0D5C63" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- the arch: an Aksum/Lalibela-style doorway -->
    <path d="M 152 404 L 152 228 A 104 104 0 0 1 360 228 L 360 404" />
    <!-- the desk: a counter across the threshold -->
    <path d="M 84 412 L 428 412" />
  </g>
</svg>
